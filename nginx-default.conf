server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Main site
    location / {
        try_files $uri $uri/ =404;
    }

    # Health endpoint used by the Docker healthcheck.
    # Returns HTTP 200 with a small JSON body.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"mibtestapp"}';
    }
}
