services:
  mibtestapp:
    image: nginx:1.27-alpine
    container_name: mibtestapp:latest
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      - APP_NAME=MIB Test App
      - APP_ENV=testing
      - TZ=Indian/Maldives
    volumes:
      - mibtestapp_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mibtest_net

volumes:
  mibtestapp_logs:

networks:
  mibtest_net:
    driver: bridge
