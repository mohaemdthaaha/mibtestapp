<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIB Test App</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0d1b2a; color:#e0e6ed;
           display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#152a41; border:1px solid #24405f; border-radius:14px;
            padding:40px 48px; max-width:520px; text-align:center; }
    h1 { margin:0 0 8px; color:#4da3ff; }
    .badge { display:inline-block; background:#1d9e75; color:#04342c; font-weight:600;
             padding:4px 12px; border-radius:20px; font-size:14px; margin:12px 0; }
    .meta { font-size:14px; color:#9db2c9; line-height:1.8; margin-top:16px; }
    code { background:#0d1b2a; padding:2px 6px; border-radius:4px; color:#7cc4ff; }
    .ver { margin-top:24px; font-size:13px; color:#5f7893; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MIB Test App</h1>
    <div class="badge">Deployed via Portainer GitOps</div>
    <p>If you can read this, the stack deployed successfully from GitHub.</p>
    <div class="meta">
      Health endpoint: <code>/health</code><br>
      Environment: <code>testing</code><br>
      Served by: <code>nginx (private network)</code>
    </div>
    <div class="ver">Version 1.0 &nbsp;&middot;&nbsp; edit this file in Git to test auto-redeploy</div>
  </div>
</body>
</html>
